baseURL: "https://DamonFAN3964.github.io/blog/"
title: "Damon不呆萌"
languageCode: "zh-CN"
hasCJKLanguage: true
theme: "papermod"

enableSearch: true  
outputs:
  home:
    - HTML
    - RSS
    - JSON  
  page:
    - HTML
  section:
    - HTML
    - RSS

pagination:
  pagerSize: 10  
  path: "page"    

menu:
  main:
    - name: "所有文章"
      url: "/posts/"
      weight: 1
    - name: "分类"
      url: "/categories/"
      weight: 2
    - name: "标签"
      url: "/tags/"
      weight: 3
    - name: "搜索"
      url: "/search/"
      weight: 4

params:
  homeInfoParams:
    Title: "Damon"
    Content: "Keep Learning Keep Exploring Keep Thinking"
  
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: true
  ShareButtons: ["x", "facebook", "reddit", "telegram"] 
  
  profileMode:
    enabled: true
    title: "Damon不呆萌's home" 
    subtitle: "习惯性自律即自由！"
    buttons:
      - name: Github
        url: "https://github.com/DamonFAN3964"

  list:
    view: "list"  
    showViewSwitch: true 
    showPagination: true  
    paginationSize: 5    
    
  ShowToc: true         
  TocOpen: true         
  ShowReadingTime: true
  math: true       
  assets:
    favicon: "/favicon.ico" 
    disableHLJS: false       

markup:
  goldmark:
    renderer:
      unsafe: true 
  tableOfContents:
    startLevel: 2
    endLevel: 4

staticDir: "static"